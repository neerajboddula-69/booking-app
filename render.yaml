services:
  - type: web
    name: appointment-booking-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: appointment_booking
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: BOOKIT

  - type: web
    name: appointment-booking-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: appointment-booking-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
